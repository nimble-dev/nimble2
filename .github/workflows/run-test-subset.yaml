name: Run a subset of nimble2 tests
# Reusable workflow called by test-all.yaml (one call per test subset).
# Using r2u container, thanks to Dirk at https://dirk.eddelbuettel.com/blog/2023/07/23/

on:
  workflow_call:
    inputs:
      test_dirs:
        description: 'Space-separated test directories, relative to the repo root'
        required: true
        type: string
      nCompiler_ref:
        description: 'nCompiler branch, tag, or SHA'
        required: true
        type: string
      nimbleModel_ref:
        description: 'nimbleModel branch, tag, or SHA'
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: rocker/r2u:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: SessionInfo
        run: R -q -e 'sessionInfo()'
      - name: Make apt patient with slow mirrors
        # r2u installs R packages via apt; r2u.stat.illinois.edu sometimes times out
        run: |
          cat > /etc/apt/apt.conf.d/80-patient <<'EOF'
          Acquire::Retries "5";
          Acquire::http::Timeout "60";
          Acquire::https::Timeout "60";
          Acquire::ftp::Timeout "60";
          EOF
      - name: Install nCompiler (${{ inputs.nCompiler_ref }})
        run: R -q -e 'remotes::install_github("nimble-dev/nCompiler", ref = "${{ inputs.nCompiler_ref }}", subdir = "nCompiler", upgrade = "never")'
      - name: Install nimbleModel (${{ inputs.nimbleModel_ref }})
        run: R -q -e 'remotes::install_github("nimble-dev/nimbleModel", ref = "${{ inputs.nimbleModel_ref }}", subdir = "nimbleModel", upgrade = "never")'
      - name: Package Dependencies
        # upgrade = "never" so the nCompiler and nimbleModel refs installed above are kept
        run: R -q -e 'remotes::install_deps("nimble2", dependencies = TRUE, upgrade = "never")'
      - name: Install inline
        # needed by nCompiler at run time but not listed in its dependencies
        run: R -q -e 'remotes::install_cran("inline")'
      - name: Build Package
        run: |
            R CMD build nimble2
            R CMD INSTALL --install-tests nimble2_*.tar.gz
      - name: Run tests
        # Run every directory even if an earlier one has failures, then fail at the end.
        env:
          TEST_DIRS: ${{ inputs.test_dirs }}
        run: |
          library(nimble2)
          test_dirs <- strsplit(trimws(Sys.getenv("TEST_DIRS")), "[[:space:]]+")[[1]]
          any_failed <- FALSE
          for(test_dir in test_dirs) {
            cat("\n==== Running tests in", test_dir, "====\n")
            results <- as.data.frame(testthat::test_dir(test_dir, reporter = "summary",
                                                        stop_on_failure = FALSE))
            if(any(results$failed > 0) || any(results$error)) any_failed <- TRUE
          }
          if(any_failed) stop("Some tests failed.")
        shell: Rscript {0}
